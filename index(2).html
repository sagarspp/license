            .main-screen {

            .main-text {
                width: calc(100% / 2 - 15px);

            .decor {
                position: relative;
                width: 100%;
                height: auto;
            }

            .decor-first {
                position: absolute;
                top: -100px;
                left: 0;
                z-index: 0;
                width: 100%;
                height: 100px;
                background-image: url(bg/deco-wave-light.png);
                background-repeat: repeat-x;
                background-size: 51% 100px;
                background-position: 397px 0;
                transform: scale(2.5,1);
            }


            .decor-second {
                position: absolute;
                top: -100px;
                left: 0;
                z-index: 0;
                width: 100%;
                height: 100px;
                background-image: url(bg/deco-wave-light.png);
                background-repeat: repeat-x;
                background-size: 51% 100px;
                background-position: 0 0;
                transform: scale(2.5,1);
                opacity: .2;
                animation: move 25s linear infinite;
            }

            .decor-third {
                position: absolute;
                top: -100px;
                left: 0;
                z-index: 0;
                width: 100%;
                height: 100px;
                background-image: url(bg/deco-wave-light.png);
                background-repeat: repeat-x;
                background-size: 51% 100px;
                background-position: 0 0;
                transform: scale(2.5,1);
                opacity: .2;
                animation: move 20s linear infinite;
            }

            @keyframes move {
                0% {
                    background-position: 0 0;
                    transform: scale(2,1);
                }
                50% {
                    background-position: 50% -50%;
                    transform: scale(2.3,1.2);
                }
                100% {
                    background-position: 100% 0;
                    transform: scale(2,1);
                }
            }
